name: badir

# =============================================================================
# LOCAL DEVELOPMENT ONLY.
#
# This compose file runs the EXTERNAL SERVICES the Next.js app needs to talk to:
# PostgreSQL, Redis, RustFS (S3-compatible object storage) and Mailpit.
#
# The application itself is NOT a service here — it is launched from your IDE
# (`pnpm dev`, or the run config of your choice) so you keep HMR, breakpoints
# and source maps. As a result:
#
#   * DATABASE_URL / S3_ENDPOINT / etc. in .env point at `localhost` (see
#     .env.example), because both ends are on the host.
#   * Schema migrations are applied on the host with `pnpm db:migrate`
#     (or `pnpm db:reset-seed` for a wiped + seeded dev database).
#   * Cron jobs (/api/cron/*) are triggered manually with curl + CRON_SECRET;
#     the scheduler (ofelia) that runs them in production lives in the
#     separate `badir-core-compose/` repo, not here.
#
# Production / staging / dev1 stacks live in `badir-core-compose/` and are
# managed by Portainer — do not promote this file.
# =============================================================================

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-badir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-badir}
      POSTGRES_DB: ${DB_NAME:-badir}

    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

    volumes:
      - badir_pgdata:/var/lib/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-badir} -d ${DB_NAME:-badir}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Rate-limiter counter store (lib/rate-limit.ts). No password locally — it is
  # bound to loopback only. Deployed environments run their own Redis on the
  # stack's internal network with `--requirepass`; see badir-core-compose.
  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command: redis-server --save "" --appendonly no

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped

    ports:
      # Web UI — http://127.0.0.1:8025
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP — point SMTP_* in .env at this if/when the app sends via SMTP
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

    volumes:
      - badir_mailpit:/data

    environment:
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Local object storage. Deployed environments use Cloudflare R2 — both speak
  # the S3 API, so the app keeps one code path; only the S3_* values in .env
  # change between local and deployed.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped

    # No `command:` override: the image entrypoint reads RUSTFS_VOLUMES and
    # appends the paths as arguments itself. It runs as the non-root user
    # `rustfs` (10001:10001); a fresh named volume mounted on /data inherits
    # that ownership from the image, so no permission-fixup service is needed.
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"

    volumes:
      - badir_rustfs:/data

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
      # RUSTFS_OBS_LOG_DIRECTORY is deliberately unset so logs go to stdout
      # and show up in `docker compose logs rustfs`.

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # RustFS initialises its volume on first boot, which is slower than
      # MinIO's — give it room before the first failure counts.
      start_period: 30s

  # One-shot bucket bootstrap so a fresh clone has somewhere to upload to.
  # Exits 0 when done — `docker compose ps` showing "exited (0)" is success.
  rustfs-init:
    image: rustfs/rc:latest
    restart: "no"

    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      rc alias set local http://rustfs:9000 "${RUSTFS_ACCESS_KEY:-rustfsadmin}" "${RUSTFS_SECRET_KEY:-rustfsadmin}" &&
      rc mb --ignore-existing local/${S3_BUCKET:-badir} &&
      rc anonymous set download local/${S3_BUCKET:-badir}

    # Public read matches how the deployed bucket is served, so local object
    # URLs work in the browser without signing them first.
    # entrypoint: >
    #   /bin/sh -c "
    #   mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-minioadmin}' &&
    #   mc mb --ignore-existing local/${S3_BUCKET:-badir} &&
    #   mc anonymous set download local/${S3_BUCKET:-badir}
    #   "

volumes:
  badir_pgdata:
  badir_mailpit:
  badir_rustfs:
